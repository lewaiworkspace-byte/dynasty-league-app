<!DOCTYPE html>
<!--
  THE OFFLINE CARD. Phase 2F, September 19, 2026.

  Served by public/sw.js when an installed app is opened with no network. It
  is deliberately the dullest file in the repository:

  IT CARRIES NO FIGURE, NO NAME AND NO DATE. Not a cap number, not a roster
  count, not "last updated". Every number in this app is read live, and the one
  moment this page renders is the one moment the app cannot check anything --
  so it says the one true thing it knows and stops. Anyone editing this file
  later: do not add a cached summary here. That is how a stale figure gets in
  front of an owner.

  IT IS SELF-CONTAINED. No stylesheet, no font, no script from anywhere. It has
  to render when nothing can be fetched, which means it cannot reference
  /_next/static or Google Fonts. The colours below are app/tokens.css's --hero,
  --ink, --ink-2, --line and --neon, written as literals for that reason -- if
  the palette ever moves, these five values are the only copies of it outside
  tokens.css and they should move with it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0D12" />
    <title>EDFL — offline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0d12;
        color: #e9edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        min-height: 100%;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) 24px
          calc(24px + env(safe-area-inset-left));
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 132px;
        height: 132px;
        border-radius: 26px;
        display: block;
        margin: 0 auto 28px;
      }
      h1 {
        font-size: 21px;
        letter-spacing: 0.02em;
        margin: 0 0 10px;
        font-weight: 600;
      }
      p {
        color: #9aa4b2;
        font-size: 15px;
        line-height: 1.55;
        margin: 0 0 28px;
      }
      button {
        appearance: none;
        border: 0;
        background: #ff5a2b;
        color: #140905;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        padding: 13px 30px;
        border-radius: 999px;
        cursor: pointer;
      }
      .rule {
        margin-top: 32px;
        padding-top: 18px;
        border-top: 1px solid #222a35;
        color: #757f8d;
        font-size: 12.5px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <img src="/icons/icon-192.png" alt="EDFL" />
        <h1>The league is out of reach</h1>
        <p>
          Your phone has no connection right now. Nothing is shown here because
          every figure in the app is read live — an old number would be a wrong
          number.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
        <div class="rule">
          The app itself is still installed. Open it again once you have a
          signal and it picks up exactly where the league is.
        </div>
      </div>
    </div>
  </body>
</html>
